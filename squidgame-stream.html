<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQUID GAME — STREAMING PORTAL (STAFFEL 1–3)</title>
  <style>
    :root {
      --pink: #ff007f;
      --pink-glow: rgba(255, 0, 127, 0.5);
      --green-bright: #00f2c3;
      --bg-dark: #070709;
      --panel-bg: #101216;
      --panel-border: #1f222e;
      --text-main: #e0e0e0;
      --text-muted: #7a7a8c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 25px;
    }

    .container { max-width: 1350px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px; background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-left: 6px solid var(--pink); border-radius: 6px; margin-bottom: 25px;
    }
    .logo-title { display: flex; align-items: center; gap: 18px; }
    .logo-title h2 { font-family: sans-serif; font-weight: 900; letter-spacing: 2px; color: #fff; font-size: 1.5rem; }
    .status-badge { background: rgba(0,242,195,0.15); border: 1px solid var(--green-bright); color: var(--green-bright); padding: 5px 12px; font-size: 0.75rem; border-radius: 3px; font-weight: bold; }

    /* SEASON TABS */
    .season-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .season-btn {
      background: #090a0d; border: 1px solid var(--panel-border); color: var(--text-muted);
      padding: 10px 18px; font-family: sans-serif; font-weight: 700; font-size: 0.8rem;
      cursor: pointer; border-radius: 4px; transition: 0.3s; text-transform: uppercase;
    }
    .season-btn:hover, .season-btn.active { background: var(--pink); color: #fff; border-color: var(--pink); }

    /* STREAMING LAYOUT */
    .stream-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
    @media (max-width: 900px) { .stream-layout { grid-template-columns: 1fr; } }

    .player-section {
      background: var(--panel-bg); border: 1px solid var(--pink); border-radius: 6px;
      padding: 20px; box-shadow: 0 0 20px var(--pink-glow);
    }
    .video-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 4px; overflow: hidden; border: 1px solid var(--panel-border); margin-bottom: 15px; }
    .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    .current-info h3 { font-family: sans-serif; color: #fff; font-size: 1.2rem; margin-bottom: 5px; }
    .current-info p { color: var(--text-muted); font-size: 0.85rem; }

    /* EPISODE LIST */
    .playlist-section {
      background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px;
      padding: 20px; max-height: 600px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .playlist-title { font-family: sans-serif; color: #fff; font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
    
    .episode-item {
      background: #090a0d; border: 1px solid var(--panel-border); padding: 14px;
      border-radius: 4px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px;
    }
    .episode-item:hover, .episode-item.active { border-color: var(--pink); background: rgba(255,0,127,0.1); }
    .ep-num { font-size: 1rem; font-weight: 900; color: var(--pink); font-family: sans-serif; min-width: 60px; }
    .ep-details { display: flex; flex-direction: column; gap: 3px; }
    .ep-name { color: #fff; font-family: sans-serif; font-weight: bold; font-size: 0.85rem; }
    .ep-sub { color: var(--text-muted); font-size: 0.75rem; }

    footer { text-align: center; margin-top: 40px; padding: 25px; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--panel-border); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-title">
        <span style="font-size: 2rem; color: var(--pink);">○ △ □</span>
        <div>
          <h2>SQUID GAME — STREAMING PORTAL</h2>
          <span style="font-size: 0.8rem; color: var(--text-muted);">KOMPLETTARCHIV: STAFFEL 1, 2 & 3</span>
        </div>
      </div>
      <div class="status-badge">ONLINE SERVER</div>
    </header>

    <div class="stream-layout">
      <!-- VIDEO PLAYER BEREICH -->
      <div class="player-section">
        <div class="video-box">
          <iframe id="mainVideoPlayer" src="https://www.youtube.com/embed/fNKyxkIuKSI" title="Squid Game Stream" allowfullscreen></iframe>
        </div>
        <div class="current-info">
          <h3 id="playerEpTitle">Staffel 1 — Episode 1: Rotlicht, Grünlicht</h3>
          <p id="playerEpDesc">Die Spieler betreten die Arena ahnungslos für das erste tödliche Kinderspiel.</p>
        </div>
      </div>

      <!-- EPISODEN AUSWAHL & STAFFEL-SWITCH -->
      <div class="playlist-section">
        <div class="season-tabs">
          <button class="season-btn active" onclick="switchSeason(1, event)">Staffel 1</button>
          <button class="season-btn" onclick="switchSeason(2, event)">Staffel 2</button>
          <button class="season-btn" onclick="switchSeason(3, event)">Staffel 3</button>
        </div>
        <div class="playlist-title" id="playlistHeader">STAFFEL 1 (EPISODEN 1–9)</div>
        <div id="episodeList">
          <!-- Episoden werden per JavaScript geladen -->
        </div>
      </div>
    </div>

    <footer>
      SQUID GAME STREAMING SERVER // SECURE HOSTED ON GITHUB PAGES
    </footer>
  </div>

  <script>
    const seasonsData = {
      1: [
        { num: 'S01E01', title: 'Rotlicht, Grünlicht', desc: 'Die Spieler betreten die Arena für das erste tödliche Kinderspiel.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S01E02', title: 'Hölle', desc: 'Die Überlebenden stimmen über den Abbruch der Spiele ab.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S01E03', title: 'Der Mann mit dem Regenschirm', desc: 'Das Zuckerscheiben-Spiel verlangt absolute Präzision.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S01E04', title: 'Teamwork', desc: 'Taktische Vorbereitung auf das brutale Tauziehen.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S01E05', title: 'Gerechte Welt', desc: 'Die Nacht im Schlafsaal eskaliert zwischen den Gruppen.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S01E06', title: 'Gganbu (Partner)', desc: 'Das emotionale Murmelspiel trennt enge Freunde.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S01E07', title: 'Die VIPs', desc: 'Hochrangige Gäste beobachten das Spiel von der Lounge aus.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S01E08', title: 'Front Man', desc: 'Der Polizist Jun-ho entkommt der Wache und enthüllt Hintergründe.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S01E09', title: 'Ein schöner Tag', desc: 'Das finale Spiel auf dem Schulhof entscheidet über den Gewinner.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' }
      ],
      2: [
        { num: 'S02E01', title: 'Rückkehr der Spiele', desc: 'Seong Gi-hun kehrt mit neuen Zielen in die Arena zurück.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S02E02', title: 'Neue Regeln', desc: 'Die verschärften Bedingungen des neuen Systems greifen.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S02E03', title: 'Die Abstimmung', desc: 'Erneute Konflikte bei der Mehrheitsentscheidung der Kandidaten.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S02E04', title: 'Verborgenes Motiv', desc: 'Allianzen bilden sich im Schatten der Überwachungskameras.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S02E05', title: 'Punkt ohne Wiederkehr', desc: 'Die Selektion wird unbarmherziger fortgesetzt.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S02E06', title: 'Verrat im System', desc: 'Ein interner Sabotageakt gefährdet das Team.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S02E07', title: 'Das Duell', desc: 'Konfrontation zwischen alten Bekannten.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' }
      ],
      3: [
        { num: 'S03E01', title: 'Das Finale beginnt', desc: 'Die letzten verbliebenen Teilnehmer betreten die Endphase.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S03E02', title: 'Psychologische Kriegsführung', desc: 'Der Druck des Front Man treibt die Spieler an ihre Grenzen.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' },
        { num: 'S03E03', title: 'Wahrheit & Maske', desc: 'Das wahre Gesicht hinter der Organisation kommt ans Licht.', url: 'https://www.youtube.com/embed/fNKyxkIuKSI' },
        { num: 'S03E04', title: 'Der letzte Kreis', desc: 'Die endgültige Entscheidung über das Schicksal der Anlage.', url: 'https://www.youtube.com/embed/2gyTqUPZTQ8' }
      ]
    };

    let currentSeason = 1;

    function renderEpisodes(season) {
      currentSeason = season;
      const listContainer = document.getElementById('episodeList');
      const header = document.getElementById('playlistHeader');
      header.innerText = `STAFFEL ${season} (EPISODEN 1–${seasonsData[season].length})`;
      listContainer.innerHTML = '';

      seasonsData[season].forEach((ep, index) => {
        listContainer.innerHTML += `
          <div class="episode-item ${index === 0 ? 'active' : ''}" id="ep-${season}-${index}" onclick="playEpisode(${season}, ${index})">
            <div class="ep-num">${ep.num}</div>
            <div class="ep-details">
              <div class="ep-name">${ep.title}</div>
              <div class="ep-sub">Klick zum Abspielen</div>
            </div>
          </div>
        `;
      });
      
      // Load first episode of the selected season
      playEpisode(season, 0);
    }

    function switchSeason(season, evt) {
      document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
      if (evt && evt.target) evt.target.classList.add('active');
      renderEpisodes(season);
    }

    function playEpisode(season, index) {
      const ep = seasonsData[season][index];
      if (!ep) return;
      
      document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`ep-${season}-${index}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('mainVideoPlayer').src = ep.url;
      document.getElementById('playerEpTitle').innerText = `Staffel ${season} — ${ep.num}: ${ep.title}`;
      document.getElementById('playerEpDesc').innerText = ep.desc;
    }

    // Initial load
    renderEpisodes(1);
  </script>
</body>
</html>
