<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQUID GAME — SYSTEM ARCHIV // GEHEIMAKTE</title>
  <style>
    :root {
      --pink: #ff007f;
      --pink-glow: rgba(255, 0, 127, 0.5);
      --green-bright: #00f2c3;
      --bg-dark: #070709;
      --panel-bg: #101216;
      --panel-border: #1f222e;
      --text-main: #e0e0e0;
      --text-muted: #7a7a8c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* LOGIN OVERLAY */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #030305;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; text-align: center; padding: 20px;
    }
    .shapes { font-size: 3.5rem; color: var(--pink); letter-spacing: 20px; margin-bottom: 15px; text-shadow: 0 0 20px var(--pink); }
    #login-overlay h1 { font-family: sans-serif; font-size: 2rem; font-weight: 900; letter-spacing: 4px; margin-bottom: 8px; color: #fff; }
    #login-overlay p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 30px; letter-spacing: 1px; }
    
    .pw-box { display: flex; gap: 10px; }
    #pwInput {
      background: #0d0f14; border: 1px solid var(--pink); color: #fff;
      padding: 14px 20px; font-family: 'Courier New', Courier, monospace; font-size: 1.3rem;
      border-radius: 4px; text-align: center; outline: none; width: 240px;
      box-shadow: 0 0 15px rgba(255,0,127,0.2);
    }
    #pwInput:focus { box-shadow: 0 0 25px var(--pink); }
    .login-btn {
      background: var(--pink); border: none; color: #fff; padding: 14px 28px;
      font-family: sans-serif; font-weight: 800; cursor: pointer;
      border-radius: 4px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1.5px;
    }
    .login-btn:hover { background: #d00068; box-shadow: 0 0 20px var(--pink); }
    .error-msg { color: #ff3333; font-size: 0.85rem; margin-top: 15px; height: 20px; }

    /* MAIN APP */
    #main-app { display: none; padding: 25px; max-width: 1350px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px; background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-left: 6px solid var(--pink); border-radius: 6px; margin-bottom: 25px;
    }
    .logo-title { display: flex; align-items: center; gap: 18px; }
    .logo-title h2 { font-family: sans-serif; font-weight: 900; letter-spacing: 2px; color: #fff; font-size: 1.5rem; }
    .status-badge { background: rgba(255,0,127,0.15); border: 1px solid var(--pink); color: var(--pink); padding: 5px 12px; font-size: 0.75rem; border-radius: 3px; font-weight: bold; }

    /* POT COUNTER BAR */
    .pot-bar {
      background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px;
      padding: 15px 25px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;
    }
    .pot-amount { font-family: sans-serif; font-size: 1.6rem; font-weight: 900; color: var(--green-bright); text-shadow: 0 0 10px rgba(0,242,195,0.3); }

    /* NAVIGATION TABS */
    .nav-tabs { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-muted);
      padding: 12px 22px; font-family: sans-serif; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; border-radius: 4px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
    }
    .tab-btn:hover, .tab-btn.active { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: 0 0 15px var(--pink-glow); }

    /* SECTIONS */
    .section { display: none; }
    .section.active { display: block; }

    /* CARDS & GRIDS */
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
    .card {
      background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 6px;
      padding: 20px; position: relative; cursor: pointer; transition: 0.3s;
    }
    .card:hover { border-color: var(--pink); transform: translateY(-4px); box-shadow: 0 6px 20px rgba(255,0,127,0.2); }
    .card-number { font-size: 2.2rem; font-weight: 900; color: var(--pink); font-family: sans-serif; margin-bottom: 4px; }
    .card-title { font-size: 1.15rem; color: #fff; font-family: sans-serif; margin-bottom: 10px; font-weight: bold; }
    .card-status { display: inline-block; padding: 3px 9px; font-size: 0.7rem; border-radius: 3px; margin-bottom: 12px; font-weight: bold; }
    .status-tot { background: rgba(255, 50, 50, 0.2); color: #ff5555; border: 1px solid #ff5555; }
    .status-gewinner { background: rgba(0, 242, 195, 0.2); color: var(--green-bright); border: 1px solid var(--green-bright); }
    .status-aktiv { background: rgba(255, 200, 0, 0.2); color: #ffcc00; border: 1px solid #ffcc00; }
    
    .card-body p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; line-height: 1.4; }
    .card-body strong { color: var(--text-main); }

    /* MODAL POPUP */
    #modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100vh;
      background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center;
      z-index: 10000; padding: 20px;
    }
    .modal-content {
      background: var(--panel-bg); border: 2px solid var(--pink); border-radius: 8px;
      max-width: 600px; width: 100%; padding: 30px; position: relative;
      box-shadow: 0 0 30px var(--pink-glow);
    }
    .modal-close {
      position: absolute; top: 15px; right: 20px; color: var(--pink); font-size: 1.8rem;
      cursor: pointer; font-weight: bold;
    }

    /* TABLE STYLES */
    .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--panel-bg); border-radius: 6px; overflow: hidden; }
    .data-table th, .data-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--panel-border); font-size: 0.85rem; }
    .data-table th { background: #161922; color: var(--pink); font-family: sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .data-table tr:hover { background: rgba(255,0,127,0.05); }

    /* SEARCH BAR */
    .search-box { margin-bottom: 22px; }
    .search-input {
      width: 100%; background: var(--panel-bg); border: 1px solid var(--panel-border);
      color: #fff; padding: 14px 20px; font-family: 'Courier New', Courier, monospace; font-size: 1rem;
      border-radius: 4px; outline: none;
    }
    .search-input:focus { border-color: var(--pink); box-shadow: 0 0 10px var(--pink-glow); }

    footer { text-align: center; margin-top: 50px; padding: 25px; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--panel-border); }
  </style>
</head>
